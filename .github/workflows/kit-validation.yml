name: ENTITY Protocol 1.0 conformance-kit integrity

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile conformance infrastructure
        run: python -m compileall -q conformance tools

      - name: Validate clean-room kit, schemas and vectors
        run: python tools/validate_kit.py

      - name: Verify signed sealed kit manifest
        run: python tools/verify_kit.py
